[package]
name = "github-app-launcher"
version = "0.1.31"
edition = "2021"

[dependencies]
anyhow = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
